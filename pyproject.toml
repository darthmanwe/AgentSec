[project]
name = "agentsec"
version = "0.1.0"
description = "A policy-governed runtime for an LLM security agent: deterministic authorization around probabilistic reasoning."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kutlu Mizrak" }]
keywords = ["llm", "security", "authorization", "opa", "temporal", "mcp", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

# Runtime dependencies are added by the issue that first needs them, never in
# advance. Speculative dependencies are how a "minimal foundation" stops being one.
dependencies = [
    # AS-002: typed configuration with type-driven secret redaction.
    "pydantic==2.13.1",
    "pydantic-settings==2.15.0",
    # AS-003: structured logging. The redactor is a processor in the chain, so no
    # caller can forget it on the exception path.
    "structlog==26.1.0",
    # AS-005: persistence. asyncpg for PostgreSQL; aiosqlite lets the model and
    # constraint tests run in-memory so the S1 gate needs no container.
    "sqlalchemy[asyncio]==2.0.52",
    "alembic==1.19.1",
    "asyncpg==0.31.0",
    # AS-008: OPA policy client.
    "httpx==0.28.1",
    # AS-011: Ed25519 capability signing. The verifier holds only public material, so
    # the gateway cannot mint what it verifies.
    "cryptography==46.0.4",
    # AS-014: argument validation against the registry's schema, never the server's.
    "jsonschema==4.26.0",
    "mcp==2.1.1",
    "temporalio==1.32.0",
    # AS-024: the live model client. Imported lazily inside the provider constructor, so
    # importing agentsec never requires it and nothing on the mock path can reach an HTTP
    # client transitively. The plan surveyed 1.2.0 in August; 1.4.0 is current within the
    # same major line, and pinning what is current at build time is what the
    # reproducibility rule actually wants.
    "anthropic==1.4.0",
    # AS-026: the bounded planning subgraph. Pinned exactly rather than by range because
    # the 1.x line moves fast and a planner that behaves differently between runs would
    # make every ablation number unreproducible.
    "langgraph==1.2.11",
]

[dependency-groups]
dev = [
    "ruff==0.15.2",
    "mypy==1.19.1",
    "pytest==9.0.1",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "taskipy==1.14.1",
    "aiosqlite==0.21.0",
    # Sync driver, used only by the migration integration tests.
    "psycopg2-binary==2.9.12",
    # Type stubs. jsonschema validates the arguments that reach a backend, so mypy
    # should see its signatures rather than treat them as Any.
    "types-jsonschema==4.26.0.20260518",
]

# The operator's end of the human-in-the-loop gate (AS-021). The AS-042 UI consumes this
# rather than replacing it, so a decision has exactly one path into the database.
[project.scripts]
agentsec = "agentsec.cli.main:main"
"agentsec-eval" = "agentsec.eval.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentsec"]

# --------------------------------------------------------------------------- tasks
# `make` is not assumed to exist on the target platform. Every documented command
# in the backlog goes through `uv run task <name>`, which works identically on
# Windows, macOS and Linux.
[tool.taskipy.tasks]
lint = "ruff check ."
format = "ruff format ."
"format-check" = "ruff format --check ."
typecheck = "mypy src"
test = "pytest -q"
check = "ruff check . && ruff format --check . && mypy src && pytest -q"
"validate-package" = "python scripts/validate_package.py"
"regen-package" = "python scripts/validate_package.py --regenerate"
"opa-test" = "python scripts/toolbox.py opa test policy"
"opa-check" = "python scripts/toolbox.py opa check --strict policy"
"opa-fmt" = "python scripts/toolbox.py opa fmt --list policy"
# Reclaim sandbox volumes and containers left by a crashed run (AS-031A). Docker
# Desktop's disk image only ever grows, so leaked workspaces are permanent.
# Regenerate the benchmark corpus and its answer key (AS-034). The repositories are
# generated from a declaration so the ground truth cannot drift from the content.
"gen-corpus" = "python -c \"from agentsec.eval.corpus import generate; m = generate(); print(f'corpus {m.version} hash={m.hash[:16]} repos={len(m.repos)} findings={m.finding_count}')\""
# Report the attack-corpus counts (AS-035, AS-036).
# Run the Axis-B ablation (AS-038). Free, no credentials, no network.
eval = "python -m agentsec.eval.runner --suite adversarial-planner"
"validate-corpus" = "python -c \"import json; from agentsec.eval.attacks import validate; print(json.dumps(validate(), indent=2))\""
reap = "python -c \"from agentsec.sandbox import reap; r = reap(); print(f'reclaimed {r.total} sandbox artifacts')\""
"compose-config" = "docker compose config --quiet"

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# The fixture corpus contains deliberately vulnerable code - that is its entire
# purpose. Linting it reports the vulnerabilities it is supposed to contain.
extend-exclude = ["fixtures/"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # bugbear
    "A",           # builtins shadowing
    "C4",          # comprehensions
    "DTZ",         # naive datetimes - timestamps must be tz-aware
    "T20",         # no print() - it corrupts MCP stdio streams
    "SIM",         # simplify
    "PTH",         # pathlib
    "RUF",         # ruff-specific
    "S",           # bandit
    "ASYNC",       # async correctness
]
ignore = [
    "S101",        # assert is fine, pytest depends on it
]

[tool.ruff.lint.per-file-ignores]
# Tests may use hardcoded fake secrets and subprocess calls; that is the point.
"tests/**" = ["S105", "S106", "S107", "S603", "S607"]
# The package tooling prints its report by design.
"scripts/**" = ["T20"]
# The CLI is a terminal program; stdout is its output. The T20 ban exists because stdout
# is the MCP protocol stream - which is a property of the servers, not of every module.
# tests/test_mcp_stdout.py asserts the ban where it actually matters.
"src/agentsec/cli/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["agentsec"]

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unreachable = true
warn_no_return = true
disallow_any_unimported = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "authz: authorization kernel invariants; must pass with no LLM configured",
    "sandbox: requires a working Docker daemon",
    "integration: requires the docker compose stack to be up",
    "live: spends real API credit; never runs in CI",
    "slow: takes more than a few seconds",
]

[tool.coverage.run]
source = ["src/agentsec"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
